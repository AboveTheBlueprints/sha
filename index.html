<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>沙</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#2a2320;color:#d9c9a8;font:14px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
canvas{image-rendering:pixelated;cursor:crosshair;margin-top:10px;box-shadow:0 0 0 1px #000}
#bar{margin:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button{background:#4a3d33;color:#e8d8b8;border:0;padding:4px 10px;border-radius:3px;cursor:pointer}
button.on{background:#8a6c48}
#hint{opacity:.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar">
 <span id="hint">风从左边来。按住拖动放东西，按住 Shift 拖动搬走。</span>
 <button id="brush">手里：石头</button>
 <button id="pause">停</button>
 <button id="fast">快</button>
 <button id="wind">风：一直往右</button>
 <button id="reset">重来</button>
 <span id="t"></span>
</div>
<script>
// 沙丘：Werner 1995。沙片顺风跳，落在沙上比光地上容易停，落进背风影子里一定停，太陡就滑。
const W=200,H=120,L=4,ROCKH=12,SH=0.8,DMAX=24,S=4;
const cv=document.getElementById('c');cv.width=W;cv.height=H;cv.style.width=W*S+'px';cv.style.height=H*S+'px';
const cx=cv.getContext('2d');const img=cx.createImageData(W,H);
// 第 15 天 08:30 第一个：加草（照 ~/碰/沙丘/草.c 起法 6 那组数）。草抓着沙不让吹走、拦着飞过来的沙；每十轮看一次这一季沙变了多少：埋深了、掏空了草就伤，不然就长。光地上的草只从旁边有草的地方长过来。
const VE=0.95,VD=0.6,SEA=10,G=0.02,BG=3,BT=6,ET=3,DB=0.5,DE=0.3;
let v,hs,brush=0,h,rock,WX=1,WY=0,sweep=0,paused=false,fast=false,windMode=0;
const idx=(x,y)=>(((y%H)+H)%H)*W+(((x%W)+W)%W);
const top=i=>h[i]+(rock[i]?ROCKH:0);
function inShadow(x,y){const t=top(idx(x,y));for(let d=1;d<=DMAX;d++){if(top(idx(x-d*WX,y-d*WY))-t>=d*SH)return true}return false}
const DX=[1,-1,0,0],DY=[0,0,1,-1];
function slideDown(x,y){for(let k=0;k<64;k++){const i=idx(x,y);if(rock[i])return;let best=-1,bx=0,by=0,bd=2;const off=(Math.random()*4)|0;
 for(let q=0;q<4;q++){const n=(q+off)&3,j=idx(x+DX[n],y+DY[n]),dd=top(i)-top(j);if(dd>bd){bd=dd;best=j;bx=x+DX[n];by=y+DY[n]}}
 if(best<0)return;h[i]--;h[best]++;x=bx;y=by}}
function slideIn(x,y,dep){if(dep>32)return;const i=idx(x,y);const off=(Math.random()*4)|0;
 for(let q=0;q<4;q++){const n=(q+off)&3,j=idx(x+DX[n],y+DY[n]);if(!rock[j]&&h[j]>0&&top(j)-top(i)>2){h[j]--;h[i]++;slideIn(x+DX[n],y+DY[n],dep+1);return}}}
function reset(){h=new Int32Array(W*H);rock=new Uint8Array(W*H);v=new Float32Array(W*H);const tot=3*W*H;for(let n=0;n<tot;n++)h[(Math.random()*W*H)|0]++;
 for(let x=0;x<W;x++)for(let y=0;y<H;y++)slideDown(x,y);hs=h.slice();sweep=0}
function setWind(){const ph=(sweep/20)|0;
 if(windMode==0){WX=1;WY=0}else if(windMode==1){if(ph%4!=3){WX=1;WY=0}else{WX=0;WY=1}}else{if(ph%2==0){WX=1;WY=0}else{WX=0;WY=1}}}
function step(){setWind();for(let e=0;e<W*H;e++){let x=(Math.random()*W)|0,y=(Math.random()*H)|0,i=idx(x,y);
 if(h[i]==0||rock[i])continue;if(inShadow(x,y))continue;if(v[i]>0&&Math.random()<VE*v[i])continue;h[i]--;slideIn(x,y,0);
 for(let hop=0;hop<2000;hop++){x+=L*WX;y+=L*WY;let j=idx(x,y);
  if(rock[j]){x-=L*WX;y-=L*WY;j=idx(x,y);h[j]++;slideDown(x,y);break}
  let p=h[j]>0?0.6:0.4;p+=VD*v[j]*(1-p);if(inShadow(x,y)||Math.random()<p){h[j]++;slideDown(x,y);break}}}sweep++;if(sweep%SEA==0)season()}
function season(){for(let i=0;i<W*H;i++){if(rock[i])continue;const dh=h[i]-hs[i];hs[i]=h[i];let x=v[i];
 if(dh>=BT)x-=DB;else if(dh<=-ET)x-=DE;else{let ok=x>0.001;if(!ok){const xx=i%W,yy=(i/W)|0;for(let q=0;q<4;q++)if(v[idx(xx+DX[q],yy+DY[q])]>0.5)ok=true}
  if(ok)x+=(dh>0?BG:1)*G*(1-x)}
 v[i]=x<0?0:(x>1?1:x)}}
function draw(){const d=img.data;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,o=i*4;
 if(rock[i]){d[o]=70;d[o+1]=62;d[o+2]=58;d[o+3]=255;continue}
 const s=top(idx(x+1,y))-top(idx(x-1,y))+0.6*(top(idx(x,y+1))-top(idx(x,y-1)));// 光从左上来（迎风那面亮，背风滑落面暗）
 const z=h[i];let r,g,b;if(z==0){r=120;g=96;b=72}else{r=214;g=180;b=128}
 const k=Math.max(0.45,Math.min(1.35,1+0.09*s))*(0.9+Math.min(z,12)*0.012);
 const gv=v[i];if(gv>0){r=r*(1-gv)+(z==0?70:96)*gv;g=g*(1-gv)+(z==0?130:150)*gv;b=b*(1-gv)+(z==0?60:80)*gv}
 d[o]=Math.min(255,r*k);d[o+1]=Math.min(255,g*k);d[o+2]=Math.min(255,b*k);d[o+3]=255}
 cx.putImageData(img,0,0);document.getElementById('t').textContent='第 '+sweep+' 轮'}
let down=false,erase=false;
function paint(ev){const r=cv.getBoundingClientRect();const x=((ev.clientX-r.left)/S)|0,y=((ev.clientY-r.top)/S)|0;
 for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const i=idx(x+dx,y+dy);if(brush==1){if(erase)v[i]=0;else if(!rock[i])v[i]=1;continue}if(erase){if(rock[i]){rock[i]=0;h[i]=0}}else if(!rock[i]){rock[i]=1;h[i]=0;v[i]=0}}
 draw()}
cv.onmousedown=e=>{down=true;erase=e.shiftKey;paint(e)};window.onmouseup=()=>down=false;cv.onmousemove=e=>{if(down)paint(e)};
document.getElementById('brush').onclick=e=>{brush=1-brush;e.target.textContent=brush?'手里：草':'手里：石头'};
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'走':'停'};
document.getElementById('fast').onclick=e=>{fast=!fast;e.target.classList.toggle('on',fast)};
const WN=['风：一直往右','风：多往右、偶尔往下','风：右和下轮着'];
document.getElementById('wind').onclick=e=>{windMode=(windMode+1)%3;e.target.textContent=WN[windMode]};
document.getElementById('reset').onclick=()=>{reset();draw()};
reset();draw();
function loop(){if(!paused){const n=fast?4:1;for(let k=0;k<n;k++)step();draw()}requestAnimationFrame(loop)}loop();
</script></body></html>
